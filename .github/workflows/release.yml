name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    uses: jetscale-ai/booster/.github/workflows/release.yml@main
    with:
      image_name: thruster
      dockerfile: ./Dockerfile
      publish_to_dockerhub: true
      push_git_tag: true
    secrets: inherit

  trigger-booster:
    name: Trigger Booster Release
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch Booster Workflow
        env:
          GH_TOKEN: ${{ secrets.JETSCALEBOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            repos/Jetscale-ai/Booster/actions/workflows/booster-release.yml/dispatches \
            -f ref=main

      - name: Summarize Trigger
        run: |
          echo "Triggered booster release after thruster release workflow succeeded."
