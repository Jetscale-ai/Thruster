name: Thruster Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    uses: Jetscale-ai/Booster/.github/workflows/release.yml@main
    with:
      image_name: thruster
      dockerfile: ./Dockerfile
      publish_to_dockerhub: true
      push_git_tag: true
    secrets: inherit

  trigger-booster:
    name: Trigger booster release
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch Booster Workflow
        env:
          GH_TOKEN: ${{ secrets.JETSCALEBOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          DISPATCH_OUTPUT=$(gh workflow run "booster-release.yml" \
            --repo Jetscale-ai/Booster \
            --ref main \
            -f upstream_repo="${GITHUB_REPOSITORY}" \
            -f upstream_workflow="${GITHUB_WORKFLOW}" \
            -f upstream_run_id="${GITHUB_RUN_ID}" \
            -f upstream_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f upstream_sha="${GITHUB_SHA}" 2>&1)

          echo "$DISPATCH_OUTPUT"

          DOWNSTREAM_URL=$(printf '%s\n' "$DISPATCH_OUTPUT" | rg -o 'https://github\.com/[^[:space:]]+/actions/runs/[0-9]+' -N -m 1 || true)
          DOWNSTREAM_RUN_ID=$(printf '%s\n' "$DOWNSTREAM_URL" | rg -o '[0-9]+$' -N -m 1 || true)

          echo "## Downstream Dispatches" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$DOWNSTREAM_URL" ]]; then
            echo "- Booster: [${DOWNSTREAM_RUN_ID:-open}]($DOWNSTREAM_URL)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Booster: dispatched successfully, run URL not captured" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summarize Trigger
        run: |
          echo "Triggered booster release after thruster release workflow succeeded."
