name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  release:
    uses: jetscale-ai/booster/.github/workflows/release.yml@main
    with:
      image_name: thruster
      dockerfile: ./Dockerfile
      publish_to_dockerhub: true
      push_git_tag: true
    secrets: inherit

  trigger-booster:
    name: Trigger Booster Release
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch Booster Workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.JETSCALEBOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'jetscale-ai',
              repo: 'booster',
              workflow_id: 'booster-release.yml',
              ref: 'main',
            });

      - name: Summarize Trigger
        run: |
          echo "Triggered booster release after thruster release workflow succeeded."
